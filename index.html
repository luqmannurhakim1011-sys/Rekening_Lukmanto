
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f0e6">
<title>Rekening Pembayaran Lukmanto</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #f5f0e6;
}

body {
  font-family: Arial, sans-serif;
}

.poster-container {
  position: relative;
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  line-height: 0;
  overflow: hidden;
}

.poster {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
}

.tap {
  position: absolute;
  display: block;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.tap:focus-visible {
  outline: 2px dashed #176b4d;
  outline-offset: 2px;
  border-radius: 6px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translate(-50%, 15px);
  z-index: 10;
  padding: 13px 20px;
  border-radius: 12px;
  color: white;
  background: #176b4d;
  font-size: 14px;
  font-weight: bold;
  line-height: 1.4;
  text-align: center;
  opacity: 0;
  visibility: hidden;
  transition: .2s ease;
  width: max-content;
  max-width: calc(100% - 30px);
}

.toast.show {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0);
}

@media (min-width: 701px) {
  .poster-container {
    box-shadow: 0 0 25px #00000010;
  }
}
</style>
</head>

<body>

<main class="poster-container">

  <!-- Gambar utama. Pastikan nama file sama persis. -->
  <img
    class="poster"
    src="./rekening-bg.png"
    alt="Poster rekening pembayaran Lukmanto"
    width="1024"
    height="1536"
    fetchpriority="high"
  >

  <!-- Bank Mega Syariah -->
  <button class="tap"
    style="left:48%;top:21%;width:37%;height:4.5%"
    aria-label="Salin nomor Bank Mega Syariah"
    onclick="salin('2013703206','Bank Mega Syariah')">
  </button>

  <button class="tap"
    style="left:85%;top:21%;width:11%;height:4.5%"
    aria-label="Salin nomor Bank Mega Syariah"
    onclick="salin('2013703206','Bank Mega Syariah')">
  </button>

  <!-- ShopeePay -->
  <button class="tap"
    style="left:48%;top:35%;width:37%;height:4.5%"
    aria-label="Salin nomor ShopeePay"
    onclick="salin('081325707659','ShopeePay')">
  </button>

  <button class="tap"
    style="left:85%;top:35%;width:11%;height:4.5%"
    aria-label="Salin nomor ShopeePay"
    onclick="salin('081325707659','ShopeePay')">
  </button>

  <!-- BRI -->
  <button class="tap"
    style="left:48%;top:48.5%;width:37%;height:4.5%"
    aria-label="Salin nomor BRI"
    onclick="salin('534601016087538','BRI')">
  </button>

  <button class="tap"
    style="left:85%;top:48.5%;width:11%;height:4.5%"
    aria-label="Salin nomor BRI"
    onclick="salin('534601016087538','BRI')">
  </button>

  <!-- SeaBank -->
  <button class="tap"
    style="left:48%;top:62.5%;width:37%;height:4.5%"
    aria-label="Salin nomor SeaBank"
    onclick="salin('901178159236','SeaBank')">
  </button>

  <button class="tap"
    style="left:85%;top:62.5%;width:11%;height:4.5%"
    aria-label="Salin nomor SeaBank"
    onclick="salin('901178159236','SeaBank')">
  </button>

  <!-- DANA -->
  <button class="tap"
    style="left:48%;top:76%;width:37%;height:4.5%"
    aria-label="Salin nomor DANA"
    onclick="salin('081325707659','DANA')">
  </button>

  <button class="tap"
    style="left:85%;top:76%;width:11%;height:4.5%"
    aria-label="Salin nomor DANA"
    onclick="salin('081325707659','DANA')">
  </button>

</main>

<div id="toast" class="toast" role="status"
  aria-live="polite"></div>

<script>
let toastTimer;

function tampilkanPesan(pesan) {
  const toast = document.getElementById('toast');
  toast.textContent = pesan;
  toast.classList.add('show');

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2000);
}

async function salin(nomor, nama) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(nomor);
    } else {
      const area = document.createElement('textarea');
      area.value = nomor;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.left = '-9999px';

      document.body.appendChild(area);
      area.select();

      const berhasil = document.execCommand('copy');
      area.remove();

      if (!berhasil) {
        throw new Error('Salin gagal');
      }
    }

    tampilkanPesan('✓ Nomor ' + nama + ' berhasil disalin!');
  } catch (error) {
    tampilkanPesan('Salin gagal. Tekan lama nomor untuk menyalin.');
  }
}
</script>

</body>
</html>
