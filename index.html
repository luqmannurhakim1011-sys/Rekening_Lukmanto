
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123d32">
<title>Rekening Pembayaran | Lukmanto</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

html {
  background: #f5f0e6;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f0e6;
  overflow-x: hidden;
}

/* Gambar memenuhi lebar layar */
.page {
  position: relative;
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  padding: 0;
  line-height: 0;
  background: #f5f0e6;
}

.poster {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  padding: 0;
  border: 0;
}

/* Area tombol transparan */
.tap {
  position: absolute;
  display: block;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 12px;
  background: transparent;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.tap:focus-visible {
  outline: 3px solid #176b4d;
  outline-offset: 2px;
}

/*
  Posisi berdasarkan persentase gambar PNG.
  Area nomor dan tombol salin dibuat terpisah.
*/

/* BANK MEGA SYARIAH */
.mega-number {
  left: 35%;
  top: 36.5%;
  width: 36%;
  height: 4.5%;
}

.mega-copy {
  left: 73%;
  top: 34.5%;
  width: 23%;
  height: 6%;
}

/* SHOPEEPAY */
.shopee-number {
  left: 35%;
  top: 47.5%;
  width: 36%;
  height: 4.5%;
}

.shopee-copy {
  left: 73%;
  top: 45.5%;
  width: 23%;
  height: 6%;
}

/* BRI */
.bri-number {
  left: 35%;
  top: 58.5%;
  width: 36%;
  height: 4.5%;
}

.bri-copy {
  left: 73%;
  top: 56.5%;
  width: 23%;
  height: 6%;
}

/* SEABANK */
.sea-number {
  left: 35%;
  top: 69.5%;
  width: 36%;
  height: 4.5%;
}

.sea-copy {
  left: 73%;
  top: 67.5%;
  width: 23%;
  height: 6%;
}

/* DANA */
.dana-number {
  left: 35%;
  top: 80.5%;
  width: 36%;
  height: 4.5%;
}

.dana-copy {
  left: 73%;
  top: 78.5%;
  width: 23%;
  height: 6%;
}

/* Pesan berhasil disalin */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: max-content;
  max-width: 90%;
  padding: 13px 18px;
  border-radius: 12px;
  background: #123d32;
  color: #fff;
  font-size: 14px;
  font-weight: bold;
  line-height: 1.5;
  text-align: center;
  box-shadow: 0 5px 20px #0003;
  display: none;
  z-index: 100;
}

.toast.show {
  display: block;
}

/* Tampilan layar besar */
@media (min-width: 701px) {
  .page {
    box-shadow: 0 0 25px #00000012;
  }
}
</style>
</head>

<body>

<main class="page">

  <img
    id="poster"
    class="poster"
    src="./rekening-bg.png"
    alt="Rekening pembayaran Lukmanto"
    draggable="false"
  >

  <!-- Bank Mega Syariah -->
  <button type="button"
    class="tap mega-number"
    aria-label="Salin nomor Bank Mega Syariah"
    onclick="salin('2013703206')"></button>

  <button type="button"
    class="tap mega-copy"
    aria-label="Salin nomor Bank Mega Syariah"
    onclick="salin('2013703206')"></button>

  <!-- ShopeePay -->
  <button type="button"
    class="tap shopee-number"
    aria-label="Salin nomor ShopeePay"
    onclick="salin('081325707659')"></button>

  <button type="button"
    class="tap shopee-copy"
    aria-label="Salin nomor ShopeePay"
    onclick="salin('081325707659')"></button>

  <!-- BRI -->
  <button type="button"
    class="tap bri-number"
    aria-label="Salin nomor BRI"
    onclick="salin('534601016087538')"></button>

  <button type="button"
    class="tap bri-copy"
    aria-label="Salin nomor BRI"
    onclick="salin('534601016087538')"></button>

  <!-- SeaBank -->
  <button type="button"
    class="tap sea-number"
    aria-label="Salin nomor SeaBank"
    onclick="salin('901178159236')"></button>

  <button type="button"
    class="tap sea-copy"
    aria-label="Salin nomor SeaBank"
    onclick="salin('901178159236')"></button>

  <!-- DANA -->
  <button type="button"
    class="tap dana-number"
    aria-label="Salin nomor DANA"
    onclick="salin('081325707659')"></button>

  <button type="button"
    class="tap dana-copy"
    aria-label="Salin nomor DANA"
    onclick="salin('081325707659')"></button>

</main>

<div id="toast" class="toast" role="status"
     aria-live="polite"></div>

<script>
let toastTimer;

async function salin(nomor) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(nomor);
    } else {
      const input = document.createElement("textarea");
      input.value = nomor;
      input.readOnly = true;
      input.style.position = "fixed";
      input.style.left = "-9999px";

      document.body.appendChild(input);
      input.select();
      input.setSelectionRange(0, nomor.length);

      const berhasil = document.execCommand("copy");
      input.remove();

      if (!berhasil) {
        throw new Error("Gagal menyalin");
      }
    }

    const toast = document.getElementById("toast");
    toast.textContent = "✓ Nomor " + nomor + " berhasil disalin";
    toast.classList.add("show");

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 2200);

  } catch (error) {
    prompt("Salin nomor rekening berikut:", nomor);
  }
}

/* Pastikan file gambar berhasil dimuat */
document.getElementById("poster").addEventListener("error", function() {
  document.body.style.background = "#f5f0e6";
  alert("Gambar tidak ditemukan. Pastikan nama file rekening-bg.png benar.");
});
</script>

</body>
</html>
