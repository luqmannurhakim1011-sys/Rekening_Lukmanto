
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123d32">
<title>Rekening Pembayaran Lukmanto</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #f5f0e4;
  font-family: Arial, sans-serif;
}

.poster {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #f5f0e4;
}

.poster-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
  user-select: none;
  pointer-events: none;
}

.tap {
  position: absolute;
  display: block;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* BANK MEGA SYARIAH */
.mega-number {
  left: 35%;
  top: 35.8%;
  width: 36%;
  height: 4.4%;
}

.mega-copy {
  left: 73.5%;
  top: 34.8%;
  width: 22%;
  height: 5.5%;
}

/* SHOPEEPAY */
.shopee-number {
  left: 35%;
  top: 46.8%;
  width: 36%;
  height: 4.4%;
}

.shopee-copy {
  left: 73.5%;
  top: 46.1%;
  width: 22%;
  height: 5.2%;
}

/* BRI */
.bri-number {
  left: 35%;
  top: 58.5%;
  width: 36%;
  height: 4.1%;
}

.bri-copy {
  left: 73.5%;
  top: 57.4%;
  width: 22%;
  height: 5.3%;
}

/* SEABANK */
.sea-number {
  left: 35%;
  top: 69.9%;
  width: 36%;
  height: 4.2%;
}

.sea-copy {
  left: 73.5%;
  top: 68.9%;
  width: 22%;
  height: 5.4%;
}

/* DANA */
.dana-number {
  left: 35%;
  top: 81.6%;
  width: 36%;
  height: 4.2%;
}

.dana-copy {
  left: 73.5%;
  top: 80.5%;
  width: 22%;
  height: 5.3%;
}

.tap:focus-visible {
  outline: 3px solid #123d32;
}

.toast {
  position: fixed;
  z-index: 10;
  left: 50%;
  bottom: 20px;
  transform: translate(-50%, 15px);
  width: max-content;
  max-width: 90%;
  padding: 12px 18px;
  border-radius: 12px;
  background: #123d32;
  color: white;
  font-size: 14px;
  font-weight: bold;
  text-align: center;
  box-shadow: 0 5px 20px #0003;
  opacity: 0;
  visibility: hidden;
  transition: .2s;
}

.toast.show {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0);
}
</style>
</head>

<body>

<main class="poster">

  <img
    class="poster-image"
    src="./rekening-bg.png"
    alt="Poster rekening pembayaran Lukmanto"
  >

  <!-- BANK MEGA SYARIAH -->
  <button class="tap mega-number"
    aria-label="Salin nomor Bank Mega Syariah"
    onclick="salin('2013703206','Bank Mega Syariah')">
  </button>

  <button class="tap mega-copy"
    aria-label="Salin nomor Bank Mega Syariah"
    onclick="salin('2013703206','Bank Mega Syariah')">
  </button>

  <!-- SHOPEEPAY -->
  <button class="tap shopee-number"
    aria-label="Salin nomor ShopeePay"
    onclick="salin('081325707659','ShopeePay')">
  </button>

  <button class="tap shopee-copy"
    aria-label="Salin nomor ShopeePay"
    onclick="salin('081325707659','ShopeePay')">
  </button>

  <!-- BRI -->
  <button class="tap bri-number"
    aria-label="Salin nomor BRI"
    onclick="salin('534601016087538','BRI')">
  </button>

  <button class="tap bri-copy"
    aria-label="Salin nomor BRI"
    onclick="salin('534601016087538','BRI')">
  </button>

  <!-- SEABANK -->
  <button class="tap sea-number"
    aria-label="Salin nomor SeaBank"
    onclick="salin('901178159236','SeaBank')">
  </button>

  <button class="tap sea-copy"
    aria-label="Salin nomor SeaBank"
    onclick="salin('901178159236','SeaBank')">
  </button>

  <!-- DANA -->
  <button class="tap dana-number"
    aria-label="Salin nomor DANA"
    onclick="salin('081325707659','DANA')">
  </button>

  <button class="tap dana-copy"
    aria-label="Salin nomor DANA"
    onclick="salin('081325707659','DANA')">
  </button>

</main>

<div id="toast" class="toast" role="status"></div>

<script>
let timer;

async function salin(nomor, nama) {
  try {
    if (navigator.clipboard &&
        window.isSecureContext) {

      await navigator.clipboard.writeText(nomor);

    } else {
      const input =
        document.createElement('textarea');

      input.value = nomor;
      input.setAttribute('readonly', '');
      input.style.position = 'fixed';
      input.style.left = '-9999px';

      document.body.appendChild(input);
      input.select();

      const berhasil =
        document.execCommand('copy');

      input.remove();

      if (!berhasil) {
        throw new Error('Gagal menyalin');
      }
    }

    pesan('✓ Nomor ' + nama +
          ' berhasil disalin');

  } catch (error) {
    pesan('Salin manual: ' + nomor);
  }
}

function pesan(teks) {
  const toast = document.getElementById('toast');

  toast.textContent = teks;
  toast.classList.add('show');

  clearTimeout(timer);

  timer = setTimeout(function() {
    toast.classList.remove('show');
  }, 2200);
}
</script>

</body>
</html>
