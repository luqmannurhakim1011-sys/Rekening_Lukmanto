<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123d32">
<title>Rekening Pembayaran Lukmanto</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5efdf;font-family:Arial,sans-serif}
.page{position:relative;width:100%;max-width:700px;margin:auto;line-height:0}
.poster{display:block;width:100%;height:auto}
.tap{position:absolute;display:block;border:0;background:transparent;padding:0;cursor:pointer;touch-action:manipulation}
.tap:focus-visible{outline:3px solid gold}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#123d32;color:white;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.4;display:none;z-index:5}
.toast.show{display:block}
</style>
</head>
<body>
<main class="page">
<img class="poster" src="rekening-bg.png" alt="Rekening pembayaran Lukmanto">
<button class="tap" style="left:48%;top:21%;width:30%;height:4%" aria-label="Salin rekening Bank Mega Syariah" onclick="salin('2013703206')"></button>
<button class="tap" style="left:86%;top:21%;width:10%;height:4%" aria-label="Salin rekening Bank Mega Syariah" onclick="salin('2013703206')"></button>
<button class="tap" style="left:48%;top:35%;width:30%;height:4%" aria-label="Salin ShopeePay" onclick="salin('081325707659')"></button>
<button class="tap" style="left:86%;top:35%;width:10%;height:4%" aria-label="Salin ShopeePay" onclick="salin('081325707659')"></button>
<button class="tap" style="left:48%;top:48%;width:30%;height:4%" aria-label="Salin rekening BRI" onclick="salin('534601016087538')"></button>
<button class="tap" style="left:86%;top:48%;width:10%;height:4%" aria-label="Salin rekening BRI" onclick="salin('534601016087538')"></button>
<button class="tap" style="left:48%;top:62%;width:30%;height:4%" aria-label="Salin rekening SeaBank" onclick="salin('901178159236')"></button>
<button class="tap" style="left:86%;top:62%;width:10%;height:4%" aria-label="Salin rekening SeaBank" onclick="salin('901178159236')"></button>
<button class="tap" style="left:48%;top:76%;width:30%;height:4%" aria-label="Salin DANA" onclick="salin('081325707659')"></button>
<button class="tap" style="left:86%;top:76%;width:10%;height:4%" aria-label="Salin DANA" onclick="salin('081325707659')"></button>
</main>
<div id="toast" class="toast" role="status"></div>
<script>
async function salin(nomor){
 try{
  if(navigator.clipboard && window.isSecureContext){
   await navigator.clipboard.writeText(nomor);
  }else{
   const t=document.createElement('textarea');
   t.value=nomor;t.style.position='fixed';t.style.left='-9999px';
   document.body.appendChild(t);t.select();
   const ok=document.execCommand('copy');t.remove();
   if(!ok)throw Error('copy gagal');
  }
  const el=document.getElementById('toast');
  el.textContent='✓ Nomor '+nomor+' berhasil disalin';
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
 }catch(e){prompt('Salin nomor ini:',nomor)}
}
</script>
</body>
</html>
