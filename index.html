
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123d32">
<title>Rekening Pembayaran | Lukmanto</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  background: #f5f0e6;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

.page {
  position: relative;
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  line-height: 0;
}

.poster {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  object-fit: contain;
}

.tap {
  position: absolute;
  display: block;
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
  border-radius: 12px;
  -webkit-tap-highlight-color: transparent;
}

.tap:focus-visible {
  outline: 3px solid #176b4d;
}

/* Area tombol mengikuti posisi pada gambar PNG.
   Sesuaikan persentasenya jika posisi tombol berbeda. */
.mega-number  { left: 48%; top: 21%; width: 34%; height: 4%; }
.mega-copy    { left: 86%; top: 21%; width: 10%; height: 4%; }

.shopee-number { left: 48%; top: 35%; width: 34%; height: 4%; }
.shopee-copy   { left: 86%; top: 35%; width: 10%; height: 4%; }

.bri-number { left: 48%; top: 48%; width: 34%; height: 4%; }
.bri-copy   { left: 86%; top: 48%; width: 10%; height: 4%; }

.sea-number { left: 48%; top: 62%; width: 34%; height: 4%; }
.sea-copy   { left: 86%; top: 62%; width: 10%; height: 4%; }

.dana-number { left: 48%; top: 76%; width: 34%; height: 4%; }
.dana-copy   { left: 86%; top: 76%; width: 10%; height: 4%; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  background: #123d32;
  color: white;
  font-size: 15px;
  line-height: 1.4;
  padding: 12px 18px;
  border-radius: 12px;
  box-shadow: 0 4px 18px #0003;
  display: none;
  z-index: 10;
  width: max-content;
  max-width: 90%;
}

.toast.show {
  display: block;
}

@media (min-width: 701px) {
  .page {
    box-shadow: 0 0 25px #0001;
  }
}
</style>
</head>

<body>
<main class="page">
  <img
    class="poster"
    src="./rekening-bg.png"
    alt="Rekening pembayaran Lukmanto"
  >

  <button class="tap mega-number"
    aria-label="Salin nomor Bank Mega Syariah"
    onclick="salin('2013703206')"></button>
  <button class="tap mega-copy"
    aria-label="Salin nomor Bank Mega Syariah"
    onclick="salin('2013703206')"></button>

  <button class="tap shopee-number"
    aria-label="Salin nomor ShopeePay"
    onclick="salin('081325707659')"></button>
  <button class="tap shopee-copy"
    aria-label="Salin nomor ShopeePay"
    onclick="salin('081325707659')"></button>

  <button class="tap bri-number"
    aria-label="Salin nomor BRI"
    onclick="salin('534601016087538')"></button>
  <button class="tap bri-copy"
    aria-label="Salin nomor BRI"
    onclick="salin('534601016087538')"></button>

  <button class="tap sea-number"
    aria-label="Salin nomor SeaBank"
    onclick="salin('901178159236')"></button>
  <button class="tap sea-copy"
    aria-label="Salin nomor SeaBank"
    onclick="salin('901178159236')"></button>

  <button class="tap dana-number"
    aria-label="Salin nomor DANA"
    onclick="salin('081325707659')"></button>
  <button class="tap dana-copy"
    aria-label="Salin nomor DANA"
    onclick="salin('081325707659')"></button>
</main>

<div id="toast" class="toast" role="status"></div>

<script>
let timerToast;

async function salin(nomor) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(nomor);
    } else {
      const input = document.createElement("textarea");
      input.value = nomor;
      input.style.position = "fixed";
      input.style.left = "-9999px";
      document.body.appendChild(input);
      input.select();

      const berhasil = document.execCommand("copy");
      input.remove();

      if (!berhasil) throw new Error("Gagal menyalin");
    }

    const toast = document.getElementById("toast");
    toast.textContent = "✓ Nomor " + nomor + " berhasil disalin";
    toast.classList.add("show");

    clearTimeout(timerToast);
    timerToast = setTimeout(() => {
      toast.classList.remove("show");
    }, 2200);
  } catch (e) {
    prompt("Salin nomor berikut:", nomor);
  }
}
</script>
</body>
</html>
