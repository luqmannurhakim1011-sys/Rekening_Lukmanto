
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rekening Pembayaran LUKMANTO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#172033}
header{background:#0875e1;color:white;text-align:center;padding:28px 15px}
header h1{margin:0 0 8px;font-size:27px}
header p{margin:0}
main{max-width:520px;margin:22px auto;padding:0 15px}
.card{background:white;padding:18px;margin-bottom:14px;border-radius:14px;box-shadow:0 3px 12px #0000000d}
.bank{font-weight:bold;font-size:18px}
.owner{color:#64748b;font-size:14px;margin-top:7px}
.number{font-size:20px;font-weight:bold;letter-spacing:1px;margin:17px 0;overflow-wrap:anywhere}
button{background:#0875e1;color:white;border:0;border-radius:9px;padding:12px 18px;font-size:15px;font-weight:bold;cursor:pointer}
footer{text-align:center;color:#64748b;font-size:13px;padding:20px}
</style>
</head>
<body>
<header>
<h1>REKENING LUKMANTO</h1>
<p>Silakan pilih rekening untuk pembayaran</p>
</header>
<main>
<div id="accounts"></div>
<div class="card">
<strong>Petunjuk pembayaran</strong>
<p>Pastikan nama penerima adalah LUKMANTO sebelum melakukan transfer.</p>
</div>
</main>
<footer>Terima kasih atas pembayaran Anda.</footer>
<script>

const rekening = [
  {
    bank: "Bank Mega Syariah",
    nomor: "2013703206"
  },
  {
    bank: "ShopeePay",
    nomor: "081325707659"
  },
  {
    bank: "BRI",
    nomor: "5346 0101 6087 538"
  },
  {
    bank: "SeaBank",
    nomor: "901178159236"
  },
  {
    bank: "DANA",
    nomor: "081325707659"
  }
];

const area=document.getElementById("accounts");
rekening.forEach((r,i)=>{
area.insertAdjacentHTML("beforeend",`
<div class="card">
<div class="bank">${r.bank}</div>
<div class="owner">Atas nama LUKMANTO</div>
<div class="number">${r.nomor.startsWith("ISI_")?"Nomor rekening belum diisi":r.nomor}</div>
<button onclick="salin(${i})">Salin nomor rekening</button>
</div>`);
});
function salin(i){
const nomor=rekening[i].nomor;
if(nomor.startsWith("ISI_")){
alert("Nomor rekening ini belum diisi.");
return;
}
navigator.clipboard.writeText(nomor)
.then(()=>alert("Nomor rekening berhasil disalin"))
.catch(()=>alert("Silakan salin nomor secara manual: "+nomor));
}
</script>
</body>
</html>
